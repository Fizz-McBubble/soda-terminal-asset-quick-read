[package]
name = "soda-asset-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false
description = "Local-only login asset snapshot probe for Soda Terminal"

[workspace]
default-members = ["."]

# Path dependencies inherit these fields without modifying the pinned source.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
ureq = "3"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
ureq = { workspace = true }
zzz-scan = { path = ".upstream/rust/crates/zzz-scan" }
zzz-wire = { path = ".upstream/rust/crates/zzz-wire" }
zzz-crypto = { path = ".upstream/rust/crates/zzz-crypto" }
zzz-capture = { path = ".upstream/rust/crates/zzz-capture" }
zzz-gamedata = { path = ".upstream/rust/crates/zzz-gamedata" }

[profile.release]
lto = true
codegen-units = 1
strip = true
